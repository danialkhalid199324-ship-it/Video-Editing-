<!doctype html>
<html>
<head>

<meta name="viewport" content="width=1080, height=1920">
<style>
  .speaker { object-fit: cover; }
</style>
</head>
<body>
<section>
  <!-- Captions on the film's time; words a graphic already shows are left out so nothing repeats -->
  <track kind="captions" src="assets/captions.vtt" srclang="en" label="English">
</section>
<section>
  <!-- Graphics: headline, underlined words, question prompt (over the speaker), then the full-screen diagram -->
  <iframe id="letter-dive" src="letter-dive.html#t=0,2.9" at="0"></iframe>
  <iframe id="sketch-words" src="sketch-words.html#t=0,2.85" at="2.95"></iframe>
  <iframe id="question-box" src="question-box.html#t=0,1.98" at="5.8"></iframe>
  <iframe id="diagram" src="diagram.html#t=0,3.98" at="7.78"></iframe>
</section>
<section>
  <!-- The picture: medium shot throughout, dead air trimmed, every word kept; the speech clips are muted for the cleaned voice -->
  <video id="line-1" src="assets/gta-talking-head.mp4#t=0.1,2.32" at="0" class="speaker" muted></video>
  <video id="line-2" src="assets/gta-talking-head.mp4#t=2.72,6.3" at="2.22" class="speaker" muted></video>
  <video id="line-3" src="assets/gta-talking-head.mp4#t=6.76,12.72" at="5.8" class="speaker" muted></video>
  <!-- The last two seconds of the GTA logo animation, with its own sound -->
  <video id="logo" src="assets/gta-talking-head.mp4#t=18.85,20.85" at="11.76" class="speaker"></video>
</section>
<section>
  <!-- The voice, cleaned of room echo and background voices (AI Producer voice enhancement), on the same cuts -->
  <audio id="voice-1" src="assets/gta-voice-enhanced.mp3#t=0.1,2.32" at="0"></audio>
  <audio id="voice-2" src="assets/gta-voice-enhanced.mp3#t=2.72,6.3" at="2.22"></audio>
  <audio id="voice-3" src="assets/gta-voice-enhanced.mp3#t=6.76,12.72" at="5.8"></audio>
</section>
<section>
  <!-- One subtle CC0 whoosh from OpenFilm's library, its peak on the cut to the logo -->
  <audio id="logo-whoosh" src="assets/soft-airy-whoosh-5619b8.mp3" at="11.63" volume="0.35"></audio>
</section>
</body>
</html>
